name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # `min_core` is "4.0", so the core must report contract 4.0: until the contract bump (hive-mind#462) is on release/4.0, use its
  # branch. Flip this to release/4.0 when #462 merges.
  CORE_REF: main
  CORE_OWNER: projectmentor      # split so `module check`'s identifying-data lint does not flag this file
  CORE_REPO: hive-mind

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: pytest
        run: pip install pytest && python3 -m pytest -q
      - name: Check out the core
        run: git clone --quiet --depth 1 --branch "$CORE_REF" "https://github.com/$CORE_OWNER/$CORE_REPO" "$RUNNER_TEMP/core"
      - name: Install the core's dependencies
        run: pip install -r "$RUNNER_TEMP/core/requirements.txt"
      - name: The manifest is signed and its files are current
        run: python3 -I scripts/sign_manifest.py --check --core "$RUNNER_TEMP/core"
      - name: module check (conformance and the ui block; the lint's warnings are advisory for this repository)
        run: |
          cd "$RUNNER_TEMP/core"
          python3 hivemind_ctl.py module check "$GITHUB_WORKSPACE" --json | tee "$RUNNER_TEMP/check.json"
          python3 -c 'import json,sys; o=json.load(open(sys.argv[1])); assert o["ok"], o["errors"]' "$RUNNER_TEMP/check.json"
